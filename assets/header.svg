
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Oluwatosin Daniel Owolabi, Senior Full-Stack Engineer and Founding Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a45"/>
      <stop offset="1" stop-color="#163a5f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 700 46px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .role { font: 700 15px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #8fb8e0; letter-spacing: 4px; }
      .line { font: 400 18px "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #d6e2ef; }
      .chip { font: 600 13px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #ffffff; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .pulse2 { animation-delay: .8s; }
      .pulse3 { animation-delay: 1.6s; }
      @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      .flow { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- text block -->
  <text x="64" y="104" class="name">Oluwatosin Daniel Owolabi</text>
  <text x="66" y="140" class="role">SENIOR FULL-STACK ENGINEER · FOUNDING ENGINEER</text>
  <text x="66" y="186" class="line">I build real-time, money-safe products end to end, from database schema to deploy.</text>

  <!-- chips -->
  <g transform="translate(66 214)">
    <rect width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#8fb8e0" stroke-opacity="0.45"/>
    <text x="59" y="22" text-anchor="middle" class="chip">NestJS</text>
    <rect x="130" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#8fb8e0" stroke-opacity="0.45"/>
    <text x="189" y="22" text-anchor="middle" class="chip">Next.js</text>
    <rect x="260" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#8fb8e0" stroke-opacity="0.45"/>
    <text x="335" y="22" text-anchor="middle" class="chip">React Native</text>
    <rect x="422" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#8fb8e0" stroke-opacity="0.45"/>
    <text x="487" y="22" text-anchor="middle" class="chip">Postgres</text>
    <rect x="564" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#8fb8e0" stroke-opacity="0.45"/>
    <text x="623" y="22" text-anchor="middle" class="chip">BullMQ</text>
  </g>

  <!-- event-flow motif: client -> api -> queue -> workers -->
  <g transform="translate(910 42)" fill="none">
    <path class="flow" d="M40 40 H130" stroke="#8fb8e0" stroke-width="2"/>
    <path class="flow" d="M170 40 V120" stroke="#8fb8e0" stroke-width="2"/>
    <path class="flow" d="M150 140 H60" stroke="#8fb8e0" stroke-width="2"/>
    <path class="flow" d="M150 150 L90 200" stroke="#8fb8e0" stroke-width="2"/>
    <circle cx="24" cy="40" r="16" fill="#ffffff" fill-opacity="0.1" stroke="#8fb8e0"/>
    <rect x="134" y="20" width="72" height="40" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#8fb8e0"/>
    <rect x="134" y="120" width="72" height="40" rx="8" fill="#ffffff" fill-opacity="0.1" stroke="#8fb8e0"/>
    <circle class="pulse" cx="44" cy="140" r="12" fill="#8fb8e0"/>
    <circle class="pulse pulse2" cx="78" cy="206" r="12" fill="#8fb8e0"/>
    <circle class="pulse pulse3" cx="24" cy="40" r="6" fill="#8fb8e0"/>
    <text x="170" y="45" text-anchor="middle" class="chip" style="font-size:11px">API</text>
    <text x="170" y="145" text-anchor="middle" class="chip" style="font-size:11px">QUEUE</text>
  </g>
</svg>
